[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faiss_wrapper"
version = "0.0.1"
authors = [
  { name="Ryuto Yoshida" },
]
description = "Simplified Python interface for FAISS (similarity search and clustering of dense vectors)."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.2",
    "faiss-cpu>=1.15.1",
    "typing-extensions>=4.4",
]

[project.urls]
Homepage = "https://github.com/ry-yoshida-dev/FaissWrapper"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/FaissWrapper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faiss_wrapper = ["py.typed"]

[tool.mypy]
mypy_path = "src"
files = ["src", "tests"]
explicit_package_bases = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# Only public classes, methods, and functions need docstrings, and multi-line ones are the local style.
ignore = ["E501", "D100", "D104", "D105", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
